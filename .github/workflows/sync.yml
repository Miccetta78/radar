name: Sync Radar dal Google Sheet

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica il foglio
        run: |
          curl -fsSL -o /tmp/sheet.csv \
            "https://docs.google.com/spreadsheets/d/1QSVIQoff2Cmowlcs1byq7HEhReJmlKXYJ_TKM5jCp44/export?format=csv&gid=358925146"
          wc -c /tmp/sheet.csv

      - name: Applica le righe al sito
        run: python3 .github/scripts/sync.py /tmp/sheet.csv

      - name: Genera pagine statiche, sitemap e SEO
        run: python3 .github/scripts/build.py

      - name: Pubblica se ci sono modifiche
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Radar bot
          GIT_COMMITTER_NAME: Radar bot
          GIT_AUTHOR_EMAIL: radar-bot
          GIT_COMMITTER_EMAIL: radar-bot
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica."
            exit 0
          fi
          git add -A
          git commit -m "Radar: aggiornamento dal foglio $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
